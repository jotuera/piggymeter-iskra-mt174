# PiggyMeter <-> Iskra Iskraemeco MT174 (IEC 62056-21, mode C)
# Example ESPHome config. Board: Lolin C3 mini. See README.md.
# Copy secrets.yaml.example -> secrets.yaml and fill in your values.

substitutions:
  name: piggymeter-iskra-mt174
  variant: esp32c3
  board: lolin_c3_mini
  rx_pin: GPIO4
  tx_pin: GPIO5
  led_pin: GPIO7

esphome:
  name: ${name}
  comment: "PiggyMeter Iskra MT174 (IEC62056-21, mode C)"

esp32:
  variant: ${variant}
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Piggymeter Fallback Hotspot"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password
  platform: esphome

# --- UART: mode C startuje na 300, negocjuje 9600. BEZ debug. ---
uart:
  id: uart_meter
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}
  baud_rate: 300
  data_bits: 7
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 2048
  debug:
    direction: RX
    dummy_receiver: false          # tap WYMAGANY (timing echa mode C) - czyta zawsze
    after:
      timeout: 500ms
    sequence:
      # log surowych bajtow bramkowany wlacznikiem (odczyt/timing dziala niezaleznie)
      - lambda: 'if (id(debug_raw_log).state) UARTDebug::log_string(direction, bytes);'

external_components:
  # Komponent IEC62056-21 (Aquaticus). Testowane z ESPHome 2026.7.
  # Jesli kompilacja sie wywali na nowszym ESPHome, uzyj kompatybilnego forka.
  - source: github://aquaticus/esphome-iec62056

iec62056:
  id: iec_meter
  uart_id: uart_meter
  update_interval: 60s
  baud_rate_max: 9600
  mode_d: false

switch:
  - platform: gpio
    pin: ${led_pin}
    name: Internal LED            # PL: Wewnetrzna dioda LED
    id: led_switch
    internal: true
  - platform: iec62056
    name: "Iskra request readout"  # PL: Iskra - wymus odczyt
    id: iskra_request_readout

  # --- STEROWANIE ---
  - platform: template
    name: "Iskra data polling"               # PL: Pobieranie danych z licznika (on/off)
    id: data_polling
    icon: "mdi:database-sync"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(iec_meter).set_update_interval(60000);
          id(iec_meter).trigger_readout();
    turn_off_action:
      - lambda: 'id(iec_meter).set_update_interval(4294967295UL);'
  - platform: template
    name: "Iskra max demand warning"         # PL: wlacznik alarmu mocy maksymalnej
    id: enable_max_demand_warning
    icon: "mdi:flash-alert"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Iskra reactive penalty alarm"     # PL: wlacznik alarmu energii biernej
    id: enable_reactive_penalty_alarm
    icon: "mdi:sine-wave"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Iskra debug raw log"              # PL: log surowych bajtow UART (on/off)
    id: debug_raw_log
    entity_category: config
    icon: "mdi:bug"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: iec62056
    name: "Iskra connection status"  # PL: Iskra - status polaczenia
    id: iskra_connection_status
    on_press:  [switch.turn_on: led_switch]
    on_release: [switch.turn_off: led_switch]

  # --- POMOCNICZE: alarmy (diagnostyka, bramkowane wlacznikami) ---
  - platform: template
    name: "Iskra reactive penalty alarm"     # PL: Alarm oplaty za bierna (tan fi > 0.4)
    id: reactive_penalty_alarm
    entity_category: diagnostic
    lambda: |-
      if (!id(enable_reactive_penalty_alarm).state) return false;
      float ti = id(tan_phi_inductive).state;
      float tc = id(tan_phi_capacitive).state;
      if (isnan(ti) && isnan(tc)) return {};
      bool bi = !isnan(ti) && ti > 0.4f;
      bool bc = !isnan(tc) && tc > 0.4f;
      return bi || bc;
  - platform: template
    name: "Iskra max demand warning"         # PL: Moc max >= 90% umownej
    id: max_demand_warning
    entity_category: diagnostic
    lambda: |-
      if (!id(enable_max_demand_warning).state) return false;
      float m = id(max_demand).state;
      float c = id(contracted_power).state;
      if (isnan(m) || isnan(c) || c <= 0.0f) return {};
      return m >= 0.9f * c;
  - platform: template
    name: "Iskra max demand exceeded"        # PL: Przekroczenie mocy umownej
    entity_category: diagnostic
    lambda: |-
      if (!id(enable_max_demand_warning).state) return false;
      float m = id(max_demand).state;
      float c = id(contracted_power).state;
      if (isnan(m) || isnan(c) || c <= 0.0f) return {};
      return m > c;

# --- POMOCNICZE: nastawa mocy umownej (ustaw wartosc w HA) ---
number:
  - platform: template
    name: "Iskra contracted power"           # PL: Moc umowna (ustaw z umowy, w kW)
    id: contracted_power
    unit_of_measurement: kW
    min_value: 1
    max_value: 40
    step: 0.5
    optimistic: true
    restore_value: true
    mode: box

  # --- KONFIG RUNTIME (strojenie w locie, domyslne = Iskra; reset do domyslnych po reboocie) ---
  - platform: template
    name: "Iskra cfg update interval"        # PL: Interwal odczytu [s]
    id: cfg_update_interval
    entity_category: config
    icon: "mdi:timer-sync"
    unit_of_measurement: s
    min_value: 5
    max_value: 3600
    step: 5
    initial_value: 60
    optimistic: true
    mode: box
    on_value:
      - lambda: 'id(iec_meter).set_update_interval((uint32_t)(x * 1000.0f));'
  - platform: template
    name: "Iskra cfg receive timeout"        # PL: Timeout odbioru [ms]
    id: cfg_receive_timeout
    entity_category: config
    icon: "mdi:timer-alert"
    unit_of_measurement: ms
    min_value: 500
    max_value: 15000
    step: 100
    initial_value: 3000
    optimistic: true
    mode: box
    on_value:
      - lambda: 'id(iec_meter).set_connection_timeout_ms((uint32_t)x);'
  - platform: template
    name: "Iskra cfg retry count"            # PL: Liczba prob (retry)
    id: cfg_retry_count
    entity_category: config
    icon: "mdi:repeat"
    min_value: 0
    max_value: 9
    step: 1
    initial_value: 2
    optimistic: true
    mode: box
    on_value:
      - lambda: 'id(iec_meter).set_max_retry_counter((int)x);'
  - platform: template
    name: "Iskra cfg retry delay"            # PL: Odstep miedzy probami [s]
    id: cfg_retry_delay
    entity_category: config
    icon: "mdi:timer-pause"
    unit_of_measurement: s
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 15
    optimistic: true
    mode: box
    on_value:
      - lambda: 'id(iec_meter).set_retry_delay((int)(x * 1000.0f));'

# --- KONFIG RUNTIME: tryb protokolu i max baud (bez flashowania) ---
select:
  # --- PROFIL: jednym kliknieciem wczytaj znane ustawienia ---
  - platform: template
    name: "Iskra profile"                    # PL: Profil licznika (preset)
    id: cfg_profile
    entity_category: config
    icon: "mdi:card-account-details-outline"
    options:
      - "Iskra MT174"
      - "Custom"
    initial_option: "Iskra MT174"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "Iskra MT174";'
          then:
            - select.set: { id: cfg_protocol, option: "Auto (mode C/B/A)" }
            - select.set: { id: cfg_max_baud, option: "9600" }
            - number.set: { id: cfg_update_interval, value: 60 }
            - number.set: { id: cfg_receive_timeout, value: 3000 }
            - number.set: { id: cfg_retry_count, value: 2 }
            - number.set: { id: cfg_retry_delay, value: 15 }
      # "Custom" = brak akcji: recznie strojysz encje cfg_*
  - platform: template
    name: "Iskra cfg protocol"               # PL: Tryb protokolu (Auto C/B/A vs wymus D)
    id: cfg_protocol
    entity_category: config
    icon: "mdi:protocol"
    options:
      - "Auto (mode C/B/A)"
      - "Force mode D"
    initial_option: "Auto (mode C/B/A)"
    optimistic: true
    on_value:
      - lambda: 'id(iec_meter).set_mode_d(x == "Force mode D");'
  - platform: template
    name: "Iskra cfg max baud"               # PL: Maksymalny baud negocjacji
    id: cfg_max_baud
    entity_category: config
    icon: "mdi:speedometer"
    options: ["300", "600", "1200", "2400", "4800", "9600", "19200"]
    initial_option: "9600"
    optimistic: true
    on_value:
      - lambda: 'id(iec_meter).set_config_baud_rate_max((uint32_t) atoi(x.c_str()));'

# =============================================================================
# SENSORY (wartosci liczbowe)
# =============================================================================
sensor:
  # --- Energia czynna pobrana (import) ---
  - platform: iec62056
    obis: "1-0:1.8.0*255"
    id: active_total
    name: "Iskra Energy import total"        # PL: Energia czynna pobrana - suma
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:1.8.1*255"
    name: "Iskra Energy import T1"           # PL: Energia czynna pobrana - taryfa 1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:1.8.2*255"
    name: "Iskra Energy import T2"           # PL: Energia czynna pobrana - taryfa 2
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  # --- Energia czynna oddana (export) - moze byc pusta jesli licznik nie liczy ---
  - platform: iec62056
    obis: "1-0:2.8.0*255"
    name: "Iskra Energy export total"        # PL: Energia czynna oddana - suma
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:2.8.1*255"
    name: "Iskra Energy export T1"           # PL: Energia czynna oddana - taryfa 1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:2.8.2*255"
    name: "Iskra Energy export T2"           # PL: Energia czynna oddana - taryfa 2
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  # --- Energia bierna (4 kwadranty) ---
  - platform: iec62056
    obis: "1-0:5.8.0*255"
    id: reactive_q1
    name: "Iskra Reactive energy Q1"         # PL: Energia bierna Q1 (indukcyjna +)
    unit_of_measurement: kvarh
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:6.8.0*255"
    name: "Iskra Reactive energy Q2"         # PL: Energia bierna Q2 (pojemnosciowa +)
    unit_of_measurement: kvarh
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:7.8.0*255"
    name: "Iskra Reactive energy Q3"         # PL: Energia bierna Q3 (indukcyjna -)
    unit_of_measurement: kvarh
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:8.8.0*255"
    id: reactive_q4
    name: "Iskra Reactive energy Q4"         # PL: Energia bierna Q4 (pojemnosciowa -)
    unit_of_measurement: kvarh
    state_class: total_increasing
    accuracy_decimals: 3

  # --- Moc ---
  - platform: iec62056
    obis: "1-0:1.5.0*255"
    name: "Iskra Power import"               # PL: Moc pobierana (usredniona)
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
  - platform: iec62056
    obis: "1-0:1.6.0*255"
    id: max_demand
    name: "Iskra Max demand"                 # PL: Moc maksymalna (demand)
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 3

  # --- Diagnostyka ---
  - platform: iec62056
    obis: "0-0:C.7.0*255"
    name: "Iskra Power failure count"        # PL: Liczba zanikow zasilania
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing

  # --- POMOCNICZE: tan fi (energia bierna / czynna, narastajaco) ---
  - platform: template
    name: "Iskra tan phi inductive"          # PL: tan fi indukcyjny (Q1/czynna)
    id: tan_phi_inductive
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      float a = id(active_total).state;
      float q = id(reactive_q1).state;
      if (isnan(a) || isnan(q) || a <= 0.0f) return {};
      return q / a;
  - platform: template
    name: "Iskra tan phi capacitive"         # PL: tan fi pojemnosciowy (Q4/czynna)
    id: tan_phi_capacitive
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      float a = id(active_total).state;
      float q = id(reactive_q4).state;
      if (isnan(a) || isnan(q) || a <= 0.0f) return {};
      return q / a;

# =============================================================================
# TEXT SENSORY (wartosci tekstowe / znaczniki)
# =============================================================================
text_sensor:
  - platform: iec62056
    obis: "1-0:0.9.1*255"
    name: "Iskra meter time"                 # PL: Czas licznika
    filters:                                 # 144646 -> 14:46:46
      - lambda: |-
          if (x.length() == 6) return x.substr(0,2) + ":" + x.substr(2,2) + ":" + x.substr(4,2);
          return x;
  - platform: iec62056
    obis: "1-0:0.9.2*255"
    name: "Iskra meter date"                 # PL: Data licznika
    filters:                                 # DYYMMDD (1260718) -> 18/07/2026
      - lambda: |-
          if (x.length() == 7) return x.substr(5,2) + "/" + x.substr(3,2) + "/20" + x.substr(1,2);
          return x;
  - platform: iec62056
    obis: "1-0:0.0.0*255"
    name: "Iskra serial number"              # PL: Numer seryjny licznika
    entity_category: diagnostic
  - platform: iec62056
    obis: "1-0:0.2.0*255"
    name: "Iskra firmware version"           # PL: Wersja firmware
    entity_category: diagnostic
  - platform: iec62056
    obis: "1-0:1.6.0*255"
    group: 2
    name: "Iskra Max demand timestamp"       # PL: Znacznik czasu mocy maksymalnej

  # --- POMOCNICZE (ENEA): log zdarzen licznika (data/godzina) ---
  - platform: iec62056
    obis: "0-0:C.51.1*255"
    name: "Iskra event count"                # PL: Liczba zapisanych zdarzen
    entity_category: diagnostic
  - platform: iec62056
    obis: "0-0:C.51.2*01"
    name: "Iskra event 1 timestamp"          # PL: Zdarzenie 1 - znacznik czasu
  - platform: iec62056
    obis: "0-0:C.51.2*02"
    name: "Iskra event 2 timestamp"          # PL: Zdarzenie 2 - znacznik czasu
  - platform: iec62056
    obis: "0-0:C.51.2*03"
    name: "Iskra event 3 timestamp"          # PL: Zdarzenie 3 - znacznik czasu
